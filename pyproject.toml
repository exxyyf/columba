[project]
name = "columba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "highdicom>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
columba-weights = "columba.weights:main"
columba-benchmark = "columba.benchmark:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/columba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
